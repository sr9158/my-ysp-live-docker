name: 自动同步并构建镜像

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 检出你自己的仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: 拉取原作者最新代码
        run: |
          git clone --depth 1 https://github.com/evanzme/ysp-live.git /tmp/upstream
          cp -a /tmp/upstream/* .
          cp -a /tmp/upstream/.[!.]* . 2>/dev/null || true
          # ⬇️ 关键修复：删除从上游仓库复制过来的 .git 目录
          rm -rf /tmp/upstream/.git

      - name: 自动备份源码到你的仓库
        run: |
          mkdir -p source_backup
          cp -a /tmp/upstream/* source_backup/
          cp -a /tmp/upstream/.[!.]* source_backup/ 2>/dev/null || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # ⬇️ 关键修复：在推送前，明确使用 GITHUB_TOKEN 设置远程仓库地址
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          git add source_backup/
          git commit -m "🤖 自动备份上游源码 [skip ci]" || echo "源码没有变化，无需备份"
          git push

      - name: 设置 Docker Buildx (多平台构建)
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
