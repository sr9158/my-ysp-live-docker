name: 全自动构建 YSP-Live 镜像

on:
  schedule:
    - cron: '0 0 * * *'   # 每天自动运行
  workflow_dispatch:       # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 获取原仓库的基础构建文件 (Dockerfile等)
        run: |
          git clone --depth 1 https://github.com/evanzme/ysp-live.git /tmp/base
          cp -a /tmp/base/* .
          cp -a /tmp/base/.[!.]* . 2>/dev/null || true

      - name: 2. 下载并解压最新的源码 ZIP 包
        run: |
          # 下载文件
          curl -L -o source.zip "https://garysclub.sharewithyou.dpdns.org/ysp-live/ysp-live-docker-v9.5.zip"
          
          # 打印文件大小（正常情况下应该在几MB以上）
          echo "下载的文件大小:"
          ls -lh source.zip
          
          # 使用 file 命令验证文件真实类型
          echo "文件的真实类型:"
          file source.zip
          
          # 如果文件不是 ZIP 格式，就输出错误信息并退出
          if ! file source.zip | grep -q "Zip archive"; then
            echo "❌ 错误：下载的文件不是有效的 ZIP 压缩包！"
            echo "📄 文件前 500 个字符的内容如下（帮助排查）："
            head -c 500 source.zip
            exit 1
          fi
          
          # 验证通过，开始解压
          unzip -o source.zip -d /tmp/unzip
          find /tmp/unzip -type f -exec cp -a {} . \;

      - name: 3. 设置 Docker Buildx (多平台构建)
        uses: docker/setup-buildx-action@v3

      - name: 4. 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}

      - name: 6. 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
