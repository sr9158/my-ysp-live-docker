name: 全自动构建 YSP-Live 镜像

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早上 8:00) 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在网页端手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 检出你自己的仓库
        uses: actions/checkout@v4

      - name: 2. 解压源码并铺平到根目录
        run: |
          # 自动查找仓库里唯一的 zip 文件（不管版本号是多少）
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 错误：未在当前仓库找到 ZIP 文件！请确保已上传。"
            exit 1
          fi
          echo "🔍 找到源码包: $ZIP_FILE"
          
          # 解压到临时目录
          unzip -o "$ZIP_FILE" -d /tmp/unzip
          
          # 使用 find 命令，把解压出来的所有文件（无视目录层级）全部抓取到当前根目录
          find /tmp/unzip -type f -exec cp -a {} . \;
          
          echo "✅ 提取完成，当前根目录包含以下核心文件："
          ls -la | grep -E "Dockerfile|\.py|\.js"

      - name: 3. 设置 Docker Buildx (多平台构建)
        uses: docker/setup-buildx-action@v3

      - name: 4. 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}
            type=sha,format=short

      - name: 6. 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
