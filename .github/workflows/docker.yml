name: 全自动构建 YSP-Live 镜像

on:
  schedule:
    - cron: '0 0 * * *'   # 每天自动运行
  workflow_dispatch:       # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 获取原仓库的基础构建文件 (Dockerfile等)
        run: |
          git clone --depth 1 https://github.com/evanzme/ysp-live.git /tmp/base
          cp -a /tmp/base/* .
          cp -a /tmp/base/.[!.]* . 2>/dev/null || true

      - name: 2. 下载并解压最新的源码 ZIP 包
        run: |
          # 尝试 1：使用伪装成真实浏览器的 Headers 下载
          curl -L -o source.zip \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.5" \
            "https://garysclub.sharewithyou.dpdns.org/ysp-live/ysp-live-docker-v9.5.zip"
          
          # 检查是否真的是 ZIP
          if ! file source.zip | grep -q "Zip archive"; then
            echo "⚠️ 伪装浏览器失败，可能触发了 JS 验证。尝试使用公共代理下载..."
            
            # 尝试 2：使用代理服务（避免 Cloudflare 识别出 GitHub 的 IP）
            curl -L -o source.zip "https://api.allorigins.win/raw?url=https%3A%2F%2Fgarysclub.sharewithyou.dpdns.org%2Fysp-live%2Fysp-live-docker-v9.5.zip"
            
            # 如果代理还是不行，报错并退出
            if ! file source.zip | grep -q "Zip archive"; then
              echo "❌ 彻底失败：文件依然不是有效的 ZIP 压缩包！"
              head -c 500 source.zip
              exit 1
            fi
          fi
          
          echo "✅ 成功下载到真实的 ZIP 包，正在解压..."
          unzip -o source.zip -d /tmp/unzip
          find /tmp/unzip -type f -exec cp -a {} . \;

      - name: 3. 设置 Docker Buildx (多平台构建)
        uses: docker/setup-buildx-action@v3

      - name: 4. 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}

      - name: 6. 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
