name: 全自动构建 YSP-Live 镜像

on:
  schedule:
    # 每天 UTC 00:00 (北京时间早上 8:00) 兜底检查，如果没变会自动跳过
    - cron: '0 0 * * *'
  push:
    # 只要上传或修改了 zip 文件，立刻触发构建
    paths:
      - '*.zip'
  workflow_dispatch: # 支持手动点击

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 检出你自己的仓库
        uses: actions/checkout@v4

      - name: 2. 计算 ZIP 包指纹 (哈希值)
        id: get-hash
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ 错误：未在当前仓库找到 ZIP 文件！"
            exit 1
          fi
          # 计算文件的 SHA256 哈希值
          HASH=$(sha256sum "$ZIP_FILE" | awk '{print $1}')
          echo "zip_hash=$HASH" >> $GITHUB_OUTPUT
          echo "🔍 找到源码包: $ZIP_FILE"
          echo "🔑 计算出的指纹: $HASH"

      - name: 3. 检查该文件是否已经构建过
        id: cache-check
        uses: actions/cache@v4
        with:
          # 我们不需要缓存文件，只需要利用 cache 的 key 来记录状态
          path: /tmp/build-marker
          key: ysp-build-${{ steps.get-hash.outputs.zip_hash }}

      - name: 4. 解压源码并铺平到根目录
        # 如果缓存命中 (以前构建过这个文件)，则跳过所有后续步骤
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          unzip -o "$ZIP_FILE" -d /tmp/unzip
          find /tmp/unzip -type f -exec cp -a {} . \;
          echo "✅ 提取完成，当前根目录包含以下核心文件："
          ls -la | grep -E "Dockerfile|\.py|\.js"

      - name: 5. 设置 Docker Buildx (多平台构建)
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: 6. 登录 GitHub 镜像仓库
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. 生成镜像标签
        if: steps.cache-check.outputs.cache-hit != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            # 同时打上一个基于哈希值的标签，方便追溯是哪个文件版本打的包
            type=raw,value=build-${{ steps.get-hash.outputs.zip_hash }}

      - name: 8. 构建并推送镜像
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 9. 记录构建成功状态
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          # 生成一个空文件，让 actions/cache 能够在任务结束时成功保存这个 hash
          mkdir -p /tmp/build-marker
          echo "done" > /tmp/build-marker/success
