name: 全自动构建 YSP-Live 镜像

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. 检出你自己的仓库
        uses: actions/checkout@v4

      - name: 2. 获取原仓库的基础构建文件 (Dockerfile等)
        run: |
          git clone --depth 1 https://github.com/evanzme/ysp-live.git /tmp/base
          cp -a /tmp/base/* .
          cp -a /tmp/base/.[!.]* . 2>/dev/null || true

      - name: 3. 解压你自己上传的 ZIP 包
        run: |
          # 直接解压当前仓库里的 zip 文件
          unzip -o ysp-live-docker-v9.5.zip -d /tmp/unzip
          # 将解压出来的新源码覆盖到当前目录
          find /tmp/unzip -type f -exec cp -a {} . \;
          echo "✅ 源码替换完成！"

      - name: 4. 设置 Docker Buildx (多平台构建)
        uses: docker/setup-buildx-action@v3

      - name: 5. 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=schedule,pattern=nightly-{{date 'YYYYMMDD'}}

      - name: 7. 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
